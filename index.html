<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOOD ART</title>
  <link rel="icon" type="image/x-icon" href="images/logo.jpg">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header" id="header">
    <a href="#home" class="logo">WOOD ART</a>

    <nav class="nav">
      <a href="#home" class="nav-link">მთავარი</a>
      <a href="#about" class="nav-link">შესახებ</a>
      <a href="#contact" class="nav-link">საკონტაქტო</a>
    </nav>

    <button class="burger" id="burger">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- overlay is OUTSIDE header -->
  <div class="menu-overlay" id="menuOverlay">
    <nav class="menu-nav">
      <a href="#home" class="menu-link">მთავარი</a>
      <a href="#about" class="menu-link">შესახებ</a>
      <a href="#contact" class="menu-link">საკონტაქტო</a>
    </nav>
  </div>

  <main>
    <section class="home_section" id="home">
      <div class="main_title">
        <h1 class="title">კომფორტისა და სტილის <span>სრულყოფილი შერწყმა</span></h1>
        <p class="sub_title">შექმენით სასურველი ინტერიერი ხარისხიან და დახვეწილ დეტალებთან ერთად.</p>
        <a href="#collection" class="hero-btn">კოლექციის ნახვა</a>
      </div>
      <div class="main_photo">
        <img src="images/main_photo.jpg" alt="main photo">
      </div>
    </section>

    <section class="about_section" id="about">
      <h2>შესახებ</h2>

    </section>

    <section class="contact_section" id="contact">
      <div class="contact_inner">

        <!-- Left side -->
        <div class="contact_left">
          <div class="contact_info">
            <h2>საკონტაქტო</h2>
          </div>
          <p>დაგვიკავშირდით</p>
          <form class="contact_form" id="contactForm">
            <div class="form_group">
              <label>სახელი</label>
              <input type="text" id="from_name" placeholder="შენი სახელი" required />
            </div>
            <div class="form_group">
              <label>ელ-ფოსტა</label>
              <input type="email" id="from_email" placeholder="შენი ელ-ფოსტა" required />
            </div>
            <div class="form_group">
              <label>შეტყობინება</label>
              <textarea id="message" rows="4" placeholder="შენი შეტყობინება" required></textarea>
            </div>
            <button type="submit" class="send_btn">
              <span id="btnText">გაგზავნა</span>
            </button>
          </form>

          <p class="form_status" id="formStatus"></p>
        </div>

      </div>
    </section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>emailjs.init("Huw9ehwUBKolvc5UG");</script>
  <script src="data/products.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
